  spring:
    application:
      name: asset-management-gateway

  # config import
    config:
      import: classpath:gateway-routes.yaml

# port
  server:
    port: 8080

  #  eurekas location
  eureka:
    client:
      service-url:
        defaultZone :  http://localhost:8761/eureka

#  actuator config
  management:
    endpoints:
      web:
        exposure:
          include: "*"
